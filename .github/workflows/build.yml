# Build, test and package Sea Otter on GitHub's hosted runners (free for public repositories).
#
#   every push / pull request   tests (native + ARM under qemu), the ARM binary, the USB package
#                               -> kept as a workflow artifact ("sea-otter-usb-<run>")
#   a tag v*  (git tag v0.1.0 && git push --tags)
#                               -> the same, published as a GitHub Release with the zip attached
#
# The release zip is the ddcsv4/ folder for a FAT32 USB stick (see docs/usb-install.md).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # only used by the release step, on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      PIPELINE_ID: gh-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabi libc6-dev-armel-cross qemu-user make python3 curl bzip2 zip

      - name: Tests (native)
        run: make test PIPELINE_ID=$PIPELINE_ID

      - name: Tests (ARM, under qemu)
        run: make test-arm PIPELINE_ID=$PIPELINE_ID

      - name: Controller binary
        run: make arm PIPELINE_ID=$PIPELINE_ID

      - name: SSH server for the USB package (dropbear, password login)
        run: sh tools/ssh/build-dropbear.sh

      - name: USB package
        run: |
          sh install/make-usb.sh
          cd build/usb
          zip -r ../../sea-otter-usb-$PIPELINE_ID.zip ddcsv4
          cd ../..
          sha256sum sea-otter-usb-$PIPELINE_ID.zip > sea-otter-usb-$PIPELINE_ID.zip.sha256
          cat sea-otter-usb-$PIPELINE_ID.zip.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: sea-otter-usb-${{ env.PIPELINE_ID }}
          path: |
            app/sea-otter-usb-*.zip
            app/sea-otter-usb-*.zip.sha256
          retention-days: 90

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sea-otter-usb-*.zip sea-otter-usb-*.zip.sha256 \
            --title "Sea Otter $GITHUB_REF_NAME" \
            --notes "USB install package for the DDCS V4.1 (build $PIPELINE_ID). Unzip, copy the ddcsv4 folder to a FAT32 stick, set network.conf, boot. See docs/usb-install.md. Not yet tested on a machine with drives connected - see the README."
