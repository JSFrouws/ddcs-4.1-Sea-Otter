# Build, test and package Sea Otter on GitHub's hosted runners (free for public repositories).
#
#   every push / pull request   tests (native + ARM under qemu), the ARM binary, the USB package
#                               -> kept as a workflow artifact ("seaotter-gh-<run>")
#   a tag v*  (git tag v0.1.0 && git push --tags)
#                               -> the same, published as a GitHub Release with the zip attached
#
# The release zip has the vendor's update-package layout: seaotter(<version>)/ddcsv4/... -
# the inner ddcsv4/ folder goes on a FAT32 USB stick (see docs/usb-install.md).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # only used by the release step, on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      PIPELINE_ID: gh-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabi libc6-dev-armel-cross qemu-user make python3 curl bzip2 unzip

      - name: Tests (native)
        run: make test PIPELINE_ID=$PIPELINE_ID

      - name: Tests (ARM, under qemu)
        run: make test-arm PIPELINE_ID=$PIPELINE_ID

      - name: Controller binary
        run: make arm PIPELINE_ID=$PIPELINE_ID

      - name: SSH server for the USB package (dropbear, password login)
        run: sh tools/ssh/build-dropbear.sh

      - name: USB package
        # same layout as the vendor's update package: seaotter(<version>)/ddcsv4/...
        run: |
          VER=$PIPELINE_ID
          case "$GITHUB_REF" in refs/tags/v*) VER=$GITHUB_REF_NAME;; esac
          echo "PKG=seaotter-$VER" >> $GITHUB_ENV
          sh install/make-usb.sh "$VER"
          unzip -l "build/seaotter-$VER.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PKG }}
          path: |
            app/build/seaotter-*.zip
            app/build/seaotter-*.zip.sha256
          retention-days: 90

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$PKG.zip" "build/$PKG.zip.sha256" \
            --title "Sea Otter $GITHUB_REF_NAME" \
            --notes "USB update package for the DDCS V4.1 (build $PIPELINE_ID), in the same layout as the vendor's update package. Unzip, copy the inner **ddcsv4** folder to the root of an empty FAT32 stick, set the IP in ddcsv4/network.conf, power off 10 s, insert, power on, remove the stick afterwards. Contains the start script (ddcsv4.out), the app, the FPGA driver it was tested with (motiondev.ko, vendor release 2025-04-04) and the boot logo. Back to the original software: see the README. **Not yet tested on a machine with drives connected** - see the README."
