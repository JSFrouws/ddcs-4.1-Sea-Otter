# Network settings for Pandora (read at every boot by ddcsv4.out).
# MODE=static uses IP / MASK / GW below; MODE=dhcp asks the router for an address.
MODE=static
IP=192.168.1.200
MASK=255.255.255.0
GW=192.168.1.1
# The unit ships with the placeholder MAC 00:04:00:00:00:00. Two units on one network
# need different MACs: uncomment and change the last numbers.
#MAC=00:04:00:00:00:01
